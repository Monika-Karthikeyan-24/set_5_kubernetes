
apiVersion: apps/v1
kind: Deployment
metadata:
  name: set5-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: set5-web
  template:
    metadata:
      labels:
        app: set5-web
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: set5-service
spec:
  type: NodePort
  selector:
    app: set5-web
  ports:
    - port: 80
      targetPort: 80
